<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>投稿与提交 | 独立增长者</title>
    <meta name="description" content="向独立增长者提交创业案例、项目看板、远程机会、伙伴招募和城市活动。" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html"><span class="brand-mark">增</span><span>独立增长者</span></a>
      <nav class="main-nav" aria-label="主导航">
        <a href="stories.html">案例</a><a href="board.html">Build Board</a><a href="jobs.html">远程机会</a><a href="partner.html">找伙伴</a>
      </nav>
      <a class="login" href="newsletter.html">加入社区</a>
    </header>
    <main>
      <section class="page-hero">
        <p class="eyebrow">Submit</p>
        <h1>提交你的案例、项目或合作需求。</h1>
        <p>我们会把信息编辑成统一摘要，突出读者需要快速判断的部分。</p>
      </section>
      <div class="page-layout">
        <section class="content-card">
          <h2>提交表单</h2>
          <form class="form-card">
            <select aria-label="提交类型">
              <option>提交类型：创业案例</option>
              <option>提交类型：Build Board 项目</option>
              <option>提交类型：远程机会</option>
              <option>提交类型：伙伴招募</option>
              <option>提交类型：城市活动</option>
            </select>
            <input type="text" placeholder="标题或项目名称" aria-label="标题或项目名称" />
            <input type="email" placeholder="联系邮箱" aria-label="联系邮箱" />
            <textarea placeholder="请写清楚背景、当前进展、关键数据、希望读者做什么。" aria-label="提交内容"></textarea>
            <button type="submit">提交</button>
          </form>
        </section>
        <aside class="sidebar">
          <section class="panel"><h2>更容易通过的内容</h2><p>真实进展、具体数字、明确问题、可验证链接和清楚的下一步。</p></section>
          <section class="panel"><h2>不收录</h2><p>纯广告、夸大收益、缺少联系方式或无法判断真实性的内容。</p></section>
        </aside>
      </div>
    </main>
    <footer class="site-footer"><p>提交后建议保留原始链接，便于编辑核对。</p><div><a href="about.html">关于</a><a href="submit.html">投稿</a><a href="privacy.html">隐私</a></div></footer>
  </body>
</html>
